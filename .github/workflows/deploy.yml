name: Publish to NuGet

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Укажите вашу версию .NET (например, 6.0.x, 8.0.x, 9.0.x)

    - name: Build and Pack NuGet
      env:
        DOTNET_ROOT: /usr/share/dotnet
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }} # Убедитесь, что секрет берется отсюда
      run: |
        dotnet restore
        # Передаем ключ лицензии напрямую как свойство MSBuild при сборке
        dotnet build --configuration Release --no-restore -p:SixLaborsLicenseKey="${{ secrets.SIXLABORS_LICENSE_KEY }}"
        # И также явно дублируем его при упаковке (так как ImageSharp валидирует проект повторно)
        dotnet pack --configuration Release --no-build --output ./output -p:SixLaborsLicenseKey="${{ secrets.SIXLABORS_LICENSE_KEY }}"

    - name: Push to NuGet
      run: |
        dotnet nuget push ./output/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://nuget.org --skip-duplicate
